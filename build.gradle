plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.circuitgrid'
    compileSdk 34
    // Must be the same NDK you installed SFML into (see ANDROID.md).
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId 'com.example.circuitgrid'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            ndkBuild {
                arguments 'APP_STL:=c++_shared', 'APP_PLATFORM:=android-21'
            }
        }
    }

    externalNativeBuild {
        ndkBuild { path 'src/main/jni/Android.mk' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // replace with your own key for distribution
        }
    }
}
